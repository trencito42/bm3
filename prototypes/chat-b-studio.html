<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blipmade · Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Geist+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="blip-fx.css">
<style>
/* B — STUDIO: chat on the left, live preview on the right. Sections assemble in as the agent builds. */
html,body{height:100%}
.app{display:grid;grid-template-columns:minmax(340px,420px) 1fr;height:100dvh}
@media(max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}

/* chat column */
.chat{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--w12);position:relative;background:#000}
.chat .hd{display:flex;align-items:center;gap:10px;height:56px;padding:0 18px;border-bottom:1px solid var(--w12);flex:none}
.chat .hd .sp{flex:1}
.chat .hd .lbl{font-size:12px;font-weight:500;color:var(--w55)}
.thread{flex:1;min-height:0;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:20px;scroll-behavior:smooth}
.empty{margin:auto 0;display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.empty p{color:var(--w75);font-size:14.5px;line-height:1.5;max-width:320px}
.empty .chips{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.msg{display:flex;gap:11px;align-items:flex-start}
.msg.u{justify-content:flex-end}
.msg.u .bub{max-width:88%;padding:10px 14px;border:1px solid var(--w12);background:var(--w04);border-radius:16px 16px 4px 16px;font-size:14px;line-height:1.5}
.msg.a .av{flex:none;width:28px;height:28px;display:grid;place-items:center}
.msg.a .body{flex:1;min-width:0;font-size:14px;line-height:1.55;color:var(--w95)}
.msg.a .txt:empty{display:none}
.secs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sec{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border:1px solid var(--w12);border-radius:99px;font-size:12px;color:var(--w55);transition:all .25s;cursor:default}
.sec i{width:6px;height:6px;border-radius:50%;background:var(--w20);transition:background .25s}
.sec.on{color:#fff;border-color:var(--w35)}.sec.on i{background:#fff}
.sec.run i{background:var(--brand);animation:pulse 1s ease-in-out infinite}
.sec:hover{background:var(--w07)}
.composer{padding:12px 14px 14px;border-top:1px solid var(--w12);flex:none}
.composer .field{padding:8px 8px 8px 14px;border-radius:14px}
.composer .field textarea{font-size:14px}
.composer .send{width:34px;height:34px;border-radius:10px}
.composer .sugg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.composer .sugg .chip{min-height:28px;padding:3px 11px;font-size:12px}

/* preview column */
.prev{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.prev>canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bar{position:relative;z-index:2;display:flex;align-items:center;gap:12px;height:56px;padding:0 18px;border-bottom:1px solid var(--w12);background:rgba(0,0,0,.6);backdrop-filter:blur(10px);flex:none}
.seg{display:flex;padding:3px;border:1px solid var(--w12);border-radius:10px;gap:2px}
.seg button{height:26px;padding:0 12px;border-radius:7px;font-size:12px;color:var(--w55);transition:all .15s}
.seg button.on{background:#fff;color:#000}
.urlbox{flex:1;min-width:0;max-width:380px;margin:0 auto;height:32px;border:1px solid var(--w12);border-radius:9px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-mono);font-size:11.5px;color:var(--w55);overflow:hidden;white-space:nowrap}
.urlbox b{color:#fff;font-weight:400}
.urlbox .lock{width:7px;height:7px;border-radius:50%;background:var(--w20)}
.urlbox.live .lock{background:#7dffb0;box-shadow:0 0 8px #7dffb0}
.pubwrap{display:flex;align-items:center;gap:10px}
.stagebox{position:relative;flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;padding:24px}
.frame{position:relative;width:100%;max-width:1000px;margin:auto 0;align-self:flex-start;border:1px solid var(--w12);border-radius:14px;overflow:hidden;background:#000;box-shadow:0 30px 80px rgba(0,0,0,.6);transition:max-width .5s var(--ease-spring)}
.frame.m{max-width:390px}
.frame .box{position:relative;overflow:hidden}
.frame .ms{position:absolute;left:0;top:0}
.blank{position:absolute;inset:0;display:grid;place-items:center;z-index:1;pointer-events:none}
.blank .in{position:relative;isolation:isolate;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px;padding:40px}
.blank p{color:var(--w55);font-size:14px;max-width:300px}
.code{position:absolute;inset:0;overflow:auto;padding:24px 28px;font-family:var(--font-mono);font-size:12.5px;line-height:1.7;color:var(--w75);white-space:pre;background:#000;display:none;z-index:3}
.code .c{color:var(--w35)}.code .t{color:#ff9a4a}.code .k{color:#5fd4ff}
.prev.showcode .code{display:block}
.pub{height:30px}
.toast{position:absolute;right:18px;bottom:18px;z-index:5;padding:12px 16px;border:1px solid var(--w20);background:#0a0a0b;border-radius:12px;font-size:13px;display:flex;gap:10px;align-items:center;animation:rise .5s var(--ease-spring) backwards}
.toast a{color:#7dffb0;font-family:var(--font-mono);font-size:12px}
</style>
</head>
<body>
<div class="app" data-dot-host-none>
  <!-- chat -->
  <section class="chat">
    <div class="hd"><span data-orb="26" id="hdorb"></span><span data-dm="BLIPMADE" data-h="12"></span><span class="lbl">Studio</span><span class="sp"></span><button class="btn ghost pub" id="reset">New</button></div>
    <div class="thread" id="thread">
      <div class="empty" id="empty">
        <span data-orb="64" id="bigorb"></span>
        <span data-dm="DESCRIBE IT" data-w="260" data-asm></span>
        <p>Tell me what you are making. I will build it on the right, section by section, while you watch.</p>
        <div class="chips" id="chips"></div>
      </div>
    </div>
    <div class="composer">
      <form class="field" id="form"><textarea id="ta" rows="1" placeholder="Describe your site…" aria-label="Message"></textarea><button class="send" id="send" disabled aria-label="Send"></button></form>
    </div>
  </section>

  <!-- preview -->
  <section class="prev" id="prev" data-dot-host>
    <canvas aria-hidden="true"></canvas>
    <div class="bar">
      <div class="seg" id="tabs"><button class="on" data-t="preview">Preview</button><button data-t="code">Code</button></div>
      <div class="urlbox" id="url"><i class="lock"></i><span><b>your-site</b>.blipmade.app</span></div>
      <div class="seg" id="dev"><button class="on" data-d="d">Desktop</button><button data-d="m">Mobile</button></div>
      <div class="pubwrap"><button class="btn pub" id="pub" disabled>Publish</button></div>
    </div>
    <div class="stagebox" id="sbox">
      <div class="blank" id="blank"><div class="in"><span class="veil"></span><span data-dm="NOTHING YET" data-w="300" data-ghost data-anim></span><p>Your preview appears here. Hover the grid.</p></div></div>
      <div class="frame" id="frame" hidden><div class="box" id="fbox"><div class="ms" id="ms"></div></div></div>
    </div>
    <pre class="code" id="code"></pre>
  </section>
</div>

<script src="blip-fx.js"></script>
<script>
var F=BlipFX,$=function(s){return document.querySelector(s)};
F.mountDots();F.mountOrbs();$('#send').innerHTML=F.SEND;F.autoGrow($('#ta'));
var field=F.dotField($('#prev>canvas'),{tone:'dark',pitch:22,glyphs:false});

var thread=$('#thread'),ta=$('#ta'),send=$('#send'),ms=$('#ms'),frame=$('#frame'),fbox=$('#fbox'),prev=$('#prev');
var PLAN=null,busy=false,mobile=false,fit;

['A bakery in Porto with online booking','Photographer portfolio with a gallery','Handmade candle shop with pricing','SaaS landing page, add FAQ'].forEach(function(t){
  var b=document.createElement('button');b.className='chip';b.textContent=t;b.type='button';b.onclick=function(){ta.value=t;ta.dispatchEvent(new Event('input'));submit()};$('#chips').appendChild(b);
});
ta.addEventListener('input',function(){send.disabled=!ta.value.trim()||busy});
ta.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()}});
$('#form').addEventListener('submit',function(e){e.preventDefault();submit()});
$('#reset').onclick=function(){location.reload()};

/* tabs + device toggle */
$('#tabs').onclick=function(e){var b=e.target.closest('button');if(!b)return;[].forEach.call(this.children,function(x){x.classList.toggle('on',x===b)});prev.classList.toggle('showcode',b.dataset.t==='code')};
$('#dev').onclick=function(e){var b=e.target.closest('button');if(!b)return;[].forEach.call(this.children,function(x){x.classList.toggle('on',x===b)});setDevice(b.dataset.d==='m')};
function setDevice(m){mobile=m;frame.classList.toggle('m',m);ms.classList.toggle('m',m);setTimeout(refit,60);setTimeout(refit,520)}
function refit(){var w=mobile?390:1000;var s=fbox.clientWidth/w;ms.style.transformOrigin='0 0';ms.style.transform='scale('+s+')';fbox.style.height=Math.max(380,Math.round(ms.offsetHeight*s))+'px'}
new ResizeObserver(refit).observe(frame);new ResizeObserver(refit).observe(ms);

function el(h){var d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild}
function scroll(){thread.scrollTop=thread.scrollHeight}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function showSource(p){
  var src=esc(F.siteSource(p));
  $('#code').innerHTML=src.replace(/(&lt;!--.*?--&gt;)/g,'<span class="c">$1</span>').replace(/(&lt;\/?[a-z0-9]+)/gi,'<span class="t">$1</span>').replace(/(id|lang|charset)=/g,'<span class="k">$1</span>=');
}
function hlSection(id,on){var s=ms.querySelector('[data-sec="'+id+'"]');if(s){s.classList.toggle('hl',on);if(on)s.scrollIntoView({block:'nearest',behavior:'smooth'})}}

async function submit(){
  var text=ta.value.trim();if(!text||busy)return;busy=true;ta.value='';ta.dispatchEvent(new Event('input'));send.disabled=true;
  var em=$('#empty');if(em)em.remove();
  thread.appendChild(el('<div class="msg u rise"><div class="bub"></div></div>')).firstChild.textContent=text;scroll();
  await F.sleep(300);
  var m=el('<div class="msg a rise"><div class="av"></div><div class="body"><p class="txt"></p></div></div>');
  var o=F.orb(28,'thinking');m.querySelector('.av').appendChild(o);thread.appendChild(m);scroll();
  var txt=m.querySelector('.txt'),body=m.querySelector('.body');await F.sleep(700);

  if(!PLAN){
    var p=F.plan(text);PLAN=p;
    o.setState('speaking');await F.stream(txt,F.reply(p),80);o.setState('thinking');
    var S=F.sections(p),chips=el('<div class="secs"></div>');
    S.forEach(function(s){var c=el('<span class="sec" data-id="'+s.id+'"><i></i>'+s.label+'</span>');c.onmouseenter=function(){hlSection(s.id,true)};c.onmouseleave=function(){hlSection(s.id,false)};chips.appendChild(c)});
    body.appendChild(chips);scroll();
    $('#blank').style.display='none';frame.hidden=false;$('#url').querySelector('span').innerHTML='<b>'+p.slug+'</b>.blipmade.app';
    F.applyTheme(ms,p);refit();
    var code=$('#code');
    for(var i=1;i<=S.length;i++){
      chips.children[i-1].classList.add('run');
      F.renderSite(ms,p,i);refit();showSource(Object.assign({},p,{sections:p.sections.slice(0,i)}));
      ms.lastElementChild.scrollIntoView({block:'end',behavior:'smooth'});
      field.pulse(prev.clientWidth*.5,prev.clientHeight*(i/S.length));      /* the grid glows where the agent is working */
      await F.sleep(700);chips.children[i-1].classList.replace('run','on');
    }
    field.pulse(-1e4,-1e4);
    var d=el('<p class="txt" style="margin-top:12px"></p>');body.appendChild(d);
    o.setState('speaking');await F.stream(d,'Done. It is live in the preview. Hover a chip to find its section, switch to mobile, or ask for changes.',80);
    o.setState('happy');setTimeout(function(){o.setState('idle')},2200);
    $('#pub').disabled=false;
  }else{
    var r=F.edit(PLAN,text);
    if(!r){o.setState('speaking');await F.stream(txt,'Try: “make it dark”, “accent green”, “add pricing”, “remove the gallery”, “use a serif”.',80);o.setState('idle')}
    else{
      PLAN=r.plan;o.setState('speaking');await F.stream(txt,'Done. I '+r.note+'.',80);
      var S2=F.renderSite(ms,PLAN);refit();showSource(PLAN);
      /* sync the section chips of the original message list is out of scope; show a fresh one */
      var chips2=el('<div class="secs"></div>');S2.forEach(function(s){var c=el('<span class="sec on"><i></i>'+s.label+'</span>');c.onmouseenter=function(){hlSection(s.id,true)};c.onmouseleave=function(){hlSection(s.id,false)};chips2.appendChild(c)});body.appendChild(chips2);
      o.setState('happy');setTimeout(function(){o.setState('idle')},1800);
    }
  }
  busy=false;send.disabled=!ta.value.trim();scroll();ta.focus();
}

$('#pub').onclick=async function(){
  var b=this;b.disabled=true;var bar=F.dotBar(14);b.replaceChildren(bar);
  for(var i=1;i<=14;i++){bar.set(i/14);await F.sleep(60)}
  b.textContent='Published';$('#url').classList.add('live');
  var t=el('<div class="toast"><span>Your site is live</span><a href="#">'+PLAN.slug+'.blipmade.app ↗</a></div>');prev.appendChild(t);setTimeout(function(){t.remove()},5000);
};
</script>
</body>
</html>
